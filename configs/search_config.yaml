search:
  # Сколько документов отдавать Участнику 4
  top_k: 5
  
  # Сколько кандидатов извлекать из базы до реранкинга (из Dense и BM25)
  # Увеличено до 20, так как документы содержат много специфичных терминов, 
  # и нам нужен хороший пул для cross-encoder'а
  candidate_k: 20
  
  # Параметр сглаживания для RRF (1 / (k + rank)). 
  # 60 — стандарт, но если BM25 будет работать сильно лучше векторов на таблицах,
  # можно будет уменьшить до 10-20.
  k_rrf: 60
  
  # Порог отсечения для BGE Reranker (вероятности от 0 до 1).
  # Отсекаем откровенный мусор, чтобы не путать LLM.
  min_reranker_score: 0.02
  
  # Глобальные флаги
  enable_reranker: true
  enable_fast_path: true

models:
  reranker: "BAAI/bge-reranker-base"
  embedder: "intfloat/multilingual-e5-base"
