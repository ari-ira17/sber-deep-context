version: '3.8'

services:
  sber-deep-context:
    build: .
    container_name: sber-deep-context
    ports:
      - "8009:8009"
    volumes:
      # Пробрасываем данные БД и загруженные файлы песочницы, чтобы они не терялись
      - ./data:/app/data
      # Пробрасываем базу знаний с вложениями
      - ./meridian_hackathon_knowledge_base:/app/meridian_hackathon_knowledge_base
    env_file:
      - .env
    restart: unless-stopped
