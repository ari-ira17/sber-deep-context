version: '3.8'

services:
  sber-deep-context:
    build: .
    container_name: sber-deep-context
    ports:
      - "8017:8017"
    volumes:
      - ./data:/app/data
      - ./meridian_hackathon_knowledge_base:/app/meridian_hackathon_knowledge_base
    env_file:
      - .env
    restart: unless-stopped
