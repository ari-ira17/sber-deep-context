<div class="sources-container">
    <div class="sources-title">
        <span>Источники контекста (Deep Agents + LanceDB)</span>
        <a href="/graph?query={{ query | urlencode }}" target="_blank" class="graph-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            Показать граф Pyvis
        </a>
    </div>
    
    <div class="source-badges">
        {% for source in sources %}
        <div class="source-badge">
            <div class="source-badge-header">
                <span class="badge-code">{{ source.code }}</span>
                <span class="badge-score">Score: {{ source.score }}</span>
            </div>
            <div class="badge-name">{{ source.name }}</div>
            <div style="font-size: 0.7rem; color: #64748b; margin-bottom: 0.3rem;">Раздел: {{ source.section }}</div>
            
            {% if source.attachment %}
            <div style="font-size: 0.75rem; color: var(--sber-neon); display: flex; align-items: center; gap: 4px;">
                📎 Вложение: .{{ source.attachment }}
            </div>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</div>
