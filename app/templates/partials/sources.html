<div class="sources-container">
    <!-- Кнопки действий -->
    <div class="grounding-assurance-bar">
        <div class="gab-right">
            {% if sources and sources[0].slug %}
            <button type="button" class="inspect-dossier-btn" onclick="openEvidenceInspector('{{ sources[0].slug }}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Досье доказательств
            </button>
            {% endif %}
            <button type="button" class="graph-btn" data-query="{{ query }}" onclick="openGraphInDrawer('{{ sources[0].slug if sources and sources[0].slug else '' }}')" title="Открыть граф связей в шторке">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
                Граф связей
            </button>
        </div>
    </div>
    
    <!-- Раздел Источники -->
    <div class="sources-list-wrapper" style="margin-top: 0.75rem;">
        <div style="font-weight: 600; font-size: 0.88rem; color: var(--text-main); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>Источники:</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
            {% for source in sources %}
            <div id="source-{{ loop.index }}" style="display: flex; align-items: center; gap: 8px; scroll-margin-top: 20px;">
                <span style="font-weight: 700; color: var(--accent); font-size: 0.85rem; min-width: 24px;">[{{ loop.index }}]</span>
                <button type="button" class="evidence-pill" onclick="openEvidenceInspector('{{ source.slug }}')" data-slug="{{ source.slug }}" title="Открыть {{ source.name }} ({{ source.slug }}) в инспекторе">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                    <span class="pill-slug">{{ source.name }}</span>
                    {% if source.code and source.code != '—' %}
                    <span style="font-size: 0.75rem; opacity: 0.75; margin-left: 2px;">({{ source.code }})</span>
                    {% endif %}
                </button>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
