<div class="sources-container">
    <!-- Кнопки действий -->
    <div class="grounding-assurance-bar">
        <div class="gab-right">
            {% if sources and sources[0].slug %}
            <button type="button" class="inspect-dossier-btn" onclick="openEvidenceInspector('{{ sources[0].slug }}')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Досье доказательств
            </button>
            {% endif %}
            <button type="button" class="graph-btn" data-query="{{ query }}" onclick="openGraphInDrawer('{{ sources[0].slug if sources and sources[0].slug else '' }}')" title="Открыть граф связей в шторке">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
                Граф связей
            </button>
        </div>
    </div>
    
    <div class="source-badges">
        {% for source in sources %}
        <div class="source-badge" onclick="openEvidenceInspector('{{ source.slug }}')" title="Открыть первоисточник [{{ source.slug }}] в инспекторе">
            <div class="source-badge-header">
                <span class="badge-code">{{ source.code }}</span>
            </div>
            <div class="badge-name">{{ source.name }}</div>
            <div style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.35rem;">Раздел: {{ source.section }}</div>
            
            {% if source.attachment %}
            <div style="font-size: 0.75rem; color: #10b981; display: flex; align-items: center; gap: 4px; font-weight: 500;">
                📎 Вложение: .{{ source.attachment }}
            </div>
            {% endif %}

            <div class="source-inspect-hint">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span>Инспектор первоисточника ↗</span>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
