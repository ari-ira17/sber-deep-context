<div class="message bot-message">
    <div class="avatar"><img src="/static/img/sbercat.jpg" alt="Сберкот"></div>
    <div class="message-content">
        <!-- Текст ответа в Markdown -->
        <div class="markdown-body">
            {{ html_answer | safe }}
        </div>
        
        <!-- Блок источников -->
        {% if sources %}
            {% include "partials/sources.html" %}
        {% endif %}

        <!-- Меню три точки (скачать) -->
        <div class="msg-actions-wrap">
            <button class="msg-more-btn" onclick="toggleMsgMenu(this)" title="Действия">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
                </svg>
            </button>
            <div class="msg-dropdown">
                <button onclick="downloadBotMsg(this, 'md')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Скачать Markdown
                </button>
                <button onclick="downloadBotMsg(this, 'docx')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Скачать DOCX
                </button>
            </div>
        </div>
    </div>
</div>
