<div class="history-list">
    {% for chat in chats %}
    <div
        class="history-item-wrapper {% if chat.id == active_chat_id %}active{% endif %}"
        id="chat-item-{{ chat.id }}"
    >

        <a
            href="/chats/{{ chat.id }}"
            class="history-item {% if chat.id == active_chat_id %}active{% endif %}"
            title="{{ chat.title }}"
        >
            {{ chat.title }}
        </a>

        <button
            type="button"
            class="favorite-chat-btn {% if chat.is_favorite %}favorite-active{% endif %}"
            hx-post="/chats/{{ chat.id }}/favorite"
            hx-target="#sidebar-chats"
            hx-swap="innerHTML"
            title="{% if chat.is_favorite %}Убрать из избранного{% else %}Добавить в избранное{% endif %}"
            aria-label="{% if chat.is_favorite %}Убрать из избранного{% else %}Добавить в избранное{% endif %}"
            onclick="event.preventDefault(); event.stopPropagation();"
        >
            <svg
                class="favorite-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="{% if chat.is_favorite %}currentColor{% else %}none{% endif %}"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 3.5l2.63 5.33 5.88.85-4.25 4.14 1 5.85L12 16.91l-5.26 2.76 1-5.85-4.25-4.14 5.88-.85L12 3.5z"/>
            </svg>
        </button>

        <!-- Удаление -->
        <button
            class="delete-chat-btn"
            hx-delete="/chats/{{ chat.id }}"
            hx-target="#sidebar-chats"
            hx-swap="innerHTML"
            title="Удалить диалог"
            onclick="event.preventDefault(); event.stopPropagation();"
        >
            <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        </button>

    </div>

    {% else %}
        <div class="empty-history">История пока пуста</div>
    {% endfor %}
</div>
