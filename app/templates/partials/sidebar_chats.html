<div class="history-list">
    {% for chat in chats %}
    <div class="history-item-wrapper {% if chat.id == active_chat_id %}active{% endif %}" id="chat-item-{{ chat.id }}">
        <a href="/chats/{{ chat.id }}" class="history-item {% if chat.id == active_chat_id %}active{% endif %}" title="{{ chat.title }}">
            {{ chat.title }}
        </a>
        <button class="delete-chat-btn" 
                hx-delete="/chats/{{ chat.id }}" 
                hx-target="#sidebar-chats" 
                hx-swap="innerHTML"
                title="Удалить диалог"
                onclick="event.stopPropagation();">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        </button>
    </div>
    {% else %}
    <div class="empty-history">История пока пуста</div>
    {% endfor %}
</div>
