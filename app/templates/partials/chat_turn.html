<!-- 1. Рендерим сообщение пользователя -->
<div class="message user-message">
    <div class="user-avatar">Вы</div>
    <div class="message-content">{{ query }}</div>
</div>

<!-- 2. Заглушка для ответа бота с лоадером -->
<div class="message bot-message" hx-get="/bot_reply?query={{ query | urlencode }}{% if chat_id %}&chat_id={{ chat_id }}{% endif %}" hx-trigger="load" hx-swap="outerHTML">
    <div class="avatar"><img src="/static/img/sbercat.jpg" alt="Сберкот"></div>
    <div class="message-content">
        <div class="loader-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
</div>

{% if chat_id %}
<script>
    (function() {
        const idInput = document.getElementById('chat-id-input');
        if (idInput) {
            idInput.value = "{{ chat_id }}";
        }
        if (window.location.pathname === '/' || !window.location.pathname.startsWith('/chats/')) {
            window.history.pushState({}, '', '/chats/{{ chat_id }}');
        }
        const srcContainer = document.getElementById('sidebar-sources-container');
        if (srcContainer) {
            srcContainer.setAttribute('hx-get', '/api/chats/{{ chat_id }}/sources/html');
        }
    })();
</script>
{% endif %}
