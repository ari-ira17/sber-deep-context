<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-помощник | Сбер</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Фоновые анимированные пятна (Нежные цвета) -->
    <div class="bg-blobs">
        <div class="blob blob-green"></div>
        <div class="blob blob-orange"></div>
        <div class="blob blob-purple"></div>
    </div>

    <!-- Общая обертка (sidebar + основной контент) -->
    <div class="app-layout">
        
        <!-- Левая панель -->
        <aside class="sidebar">
            <div class="sidebar-logo">Квантум</div>
            
            <a href="/" class="new-chat-btn" style="text-decoration: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Новый чат
            </a>
            
            <div class="sidebar-nav">
                <!-- Секция Источников (Песочница документов чата) -->
                <div class="sidebar-section">
                    <div class="sidebar-section-header">
                        <h3>Источники</h3>
                        <label class="sidebar-add-source-btn" title="Добавить документ в песочницу">
                            <input type="file" id="sidebar-file-upload" onchange="window.handleSidebarFileUpload(this.files)" style="display: none;" multiple>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </label>
                    </div>
                    <div id="sidebar-sources-container"
                         hx-get="/api/sources/html"
                         hx-trigger="refreshSources from:body"
                         hx-swap="innerHTML">
                        {% include "partials/sidebar_sources.html" %}
                    </div>
                </div>

                <!-- Секция Истории диалогов -->
                <div class="sidebar-section" style="margin-top: 1.25rem;">
                    <div class="sidebar-section-header">
                        <h3>История</h3>
                    </div>
                    <div id="sidebar-chats"
                         hx-get="/api/chats{% if active_chat_id %}?active_id={{ active_chat_id }}{% endif %}"
                         hx-trigger="refreshSidebar from:body"
                         hx-swap="innerHTML">
                        {% include "partials/sidebar_chats.html" %}
                    </div>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="auth-profile" id="auth-profile-display" style="display: none; padding: 0.5rem 0.8rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; background: var(--glass-btn-bg); border-radius: 12px; font-weight: 500; font-size: 0.9rem;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div id="auth-profile-avatar-node" style="width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.75rem;">ИФ</div>
                        <span id="auth-profile-name">Иванов И.</span>
                    </div>
                    <button id="logout-btn" title="Выйти" style="background: transparent; border: none; color: #ef4444; cursor: pointer; padding: 4px; display: flex; align-items: center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <a href="#" class="settings-btn" id="theme-toggle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <span id="theme-text">Темная тема</span>
                </a>
                <a href="#" class="settings-btn" id="open-settings-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    Настройки
                </a>
            </div>
        </aside>

        <!-- Основная область с чатом -->
        <main class="main-view">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Шторка инспектора доказательств (Evidence Inspector Drawer) -->
    <div id="evidence-drawer-backdrop" class="evidence-backdrop" onclick="closeEvidenceInspector()"></div>
    <aside id="evidence-drawer" class="evidence-drawer" aria-hidden="true">
        <div id="evidence-drawer-body">
            <!-- Динамически загружается через /evidence/drawer/{slug} -->
        </div>
    </aside>

    <!-- Всплывающие уведомления (Toasts) -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Инициализация темы
        const themeText = document.getElementById('theme-text');
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            if(themeText) themeText.innerText = 'Светлая тема';
        }

        // Переключение темы
        document.getElementById('theme-toggle').addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeText.innerText = isDark ? 'Светлая тема' : 'Темная тема';
            // Оповещаем все встроенные iframe (включая граф) о смене темы
            document.querySelectorAll('iframe').forEach(f => {
                try {
                    f.contentWindow.postMessage({ type: 'theme-change', isDark: isDark }, '*');
                } catch(err) {}
            });
        });

        // Быстрая вставка текста в инпут и программная отправка формы
        function sendQuickPrompt(text) {
            const input = document.querySelector('.input-field');
            const form = document.querySelector('.input-form');
            input.value = text;
            
            // Триггерим событие submit для HTMX
            const event = new Event('submit', { cancelable: true, bubbles: true });
            form.dispatchEvent(event);
        }
        
        // Скрываем welcome-экран при добавлении первого сообщения и скроллим вниз
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if(evt.detail.target.id === 'chat-history') {
                const welcome = document.querySelector('.welcome-screen');
                if(welcome) welcome.style.display = 'none';
                
                // Прокрутка чата вниз (скроллится область .chat-scroll-area)
                const scrollArea = document.getElementById('chat-scroll-area');
                if(scrollArea) {
                    scrollArea.scrollTop = scrollArea.scrollHeight;
                }
            }
        });

        // ==========================================
        // SANDBOX SOURCES JAVASCRIPT LOGIC
        // ==========================================
        window.handleSidebarFileUpload = async function(filesList) {
            const files = Array.from(filesList);
            if (!files.length) return;

            const formData = new FormData();
            files.forEach(f => formData.append('files', f));

            try {
                const res = await fetch('/api/sources/upload', {
                    method: 'POST',
                    body: formData,
                });
                const data = await res.json();
                if (data.success) {
                    if (window.htmx) {
                        htmx.trigger('body', 'refreshSources');
                    }
                }
            } catch (err) {
                console.error('Ошибка загрузки файлов:', err);
            }
        };

        window.deleteSandboxSource = async function(sourceId, event) {
            if (event) event.stopPropagation();
            const item = document.getElementById(`source-item-${sourceId}`);
            if (item) item.style.opacity = '0.3';

            try {
                const res = await fetch(`/api/sources/${sourceId}`, {
                    method: 'DELETE',
                });
                const data = await res.json();
                if (window.htmx) {
                    htmx.trigger('body', 'refreshSources');
                }
                if (window.currentEvidenceSlug === `sandbox-${sourceId}` && typeof closeEvidenceInspector === 'function') {
                    closeEvidenceInspector();
                }
            } catch (err) {
                console.error('Ошибка при удалении источника:', err);
                if (item) item.style.opacity = '1';
            }
        };

        // ==========================================
        // EVIDENCE INSPECTOR JAVASCRIPT LOGIC
        // ==========================================
        let isDrawerWide = false;
        let evidenceHistory = [];
        let currentEvidenceSlug = null;

        async function openEvidenceInspector(slug, highlightTerm = '', isBack = false) {
            if (!slug) return;
            const drawer = document.getElementById('evidence-drawer');
            const backdrop = document.getElementById('evidence-drawer-backdrop');
            const body = document.getElementById('evidence-drawer-body');
            if (!drawer || !backdrop || !body) return;

            // Отслеживаем историю переходов внутри инспектора
            if (!isBack && currentEvidenceSlug && currentEvidenceSlug !== slug) {
                evidenceHistory.push(currentEvidenceSlug);
            }
            currentEvidenceSlug = slug;

            // Отображаем плавный скелетон-лоадер
            body.innerHTML = `
                <div class="evidence-skeleton">
                    <div class="sk-pill"></div>
                    <div class="sk-title"></div>
                    <div class="sk-bar"></div>
                    <div class="sk-tabs"></div>
                    <div class="sk-line"></div>
                    <div class="sk-line" style="width: 85%;"></div>
                    <div class="sk-line" style="width: 70%;"></div>
                    <div class="sk-box"></div>
                </div>
            `;

            drawer.classList.add('active');
            backdrop.classList.add('active');
            document.body.classList.add('drawer-open');

            try {
                const url = `/evidence/drawer/${encodeURIComponent(slug)}` + 
                            (highlightTerm ? `?highlight=${encodeURIComponent(highlightTerm)}` : '');
                const res = await fetch(url);
                if (!res.ok) {
                    body.innerHTML = `
                        <div class="evidence-error">
                            <div class="err-icon">⚠️</div>
                            <h3>Первоисточник не найден</h3>
                            <p>Документ <code>${slug}</code> не обнаружен в базе знаний «Меридиан».</p>
                            <button class="drawer-btn close-btn" onclick="closeEvidenceInspector()">Закрыть</button>
                        </div>
                    `;
                    return;
                }
                const html = await res.text();
                body.innerHTML = html;

                // Кнопка возврата при переходе по внутренним ссылкам
                const backBtn = document.getElementById('evidence-nav-back-btn');
                if (backBtn) {
                    if (evidenceHistory.length > 0) {
                        const prev = evidenceHistory[evidenceHistory.length - 1];
                        backBtn.style.display = 'inline-flex';
                        backBtn.title = (prev && typeof prev === 'object' && prev.type === 'graph')
                            ? 'Назад к графу связей'
                            : `Назад к ${prev}`;
                    } else {
                        backBtn.style.display = 'none';
                    }
                }

                if (highlightTerm) {
                    searchWithinDocument(highlightTerm);
                }
            } catch (err) {
                body.innerHTML = `
                    <div class="evidence-error">
                        <div class="err-icon">⚠️</div>
                        <h3>Ошибка загрузки</h3>
                        <p>${err.message}</p>
                        <button class="drawer-btn close-btn" onclick="closeEvidenceInspector()">Закрыть</button>
                    </div>
                `;
            }
        }

        function openGraphDrawer(query, isBack = false) {
            if (!query) query = "Запрос";
            const drawer = document.getElementById('evidence-drawer');
            const backdrop = document.getElementById('evidence-drawer-backdrop');
            const body = document.getElementById('evidence-drawer-body');
            if (!drawer || !backdrop || !body) return;

            // Отслеживаем историю
            if (!isBack && currentEvidenceSlug) {
                evidenceHistory.push(currentEvidenceSlug);
            }
            currentEvidenceSlug = { type: 'graph', query: query };

            // Включаем широкий режим для комфортного взаимодействия с графом
            isDrawerWide = true;
            drawer.classList.add('wide');
            drawer.classList.add('active');
            backdrop.classList.add('active');
            document.body.classList.add('drawer-open');

            const cleanQuery = (query || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            const shortTitle = query.length > 32 ? query.substring(0, 30) + '...' : query;
            const hasPrev = evidenceHistory.length > 0;

            body.innerHTML = `
                <div class="evidence-content-inner evidence-graph-drawer-inner">
                    <div class="evidence-header">
                        <div class="evidence-header-top">
                            <div class="evidence-header-title-wrap">
                                <button type="button" id="evidence-nav-back-btn" class="drawer-back-btn" style="${hasPrev ? 'display: inline-flex;' : 'display: none;'}" onclick="evidenceGoBack()" title="Назад">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="19" y1="12" x2="5" y2="12"></line>
                                        <polyline points="12 19 5 12 12 5"></polyline>
                                    </svg>
                                </button>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                                    <circle cx="18" cy="5" r="3"></circle>
                                    <circle cx="6" cy="12" r="3"></circle>
                                    <circle cx="18" cy="19" r="3"></circle>
                                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                                </svg>
                                <h2 class="evidence-header-title" title="${cleanQuery}">Граф связей: ${shortTitle}</h2>
                            </div>
                            
                            <div class="evidence-controls">
                                <button type="button" class="drawer-btn" onclick="toggleDrawerWidth()" title="Переключить ширину">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="15 3 21 3 21 9"></polyline>
                                        <polyline points="9 21 3 21 3 15"></polyline>
                                        <line x1="21" y1="3" x2="14" y2="10"></line>
                                        <line x1="3" y1="21" x2="10" y2="14"></line>
                                    </svg>
                                </button>
                                <button type="button" class="drawer-btn close-btn" onclick="closeEvidenceInspector()" title="Закрыть (Esc)">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="evidence-graph-container">
                        <iframe src="/graph?query=${encodeURIComponent(query)}&embedded=true" class="evidence-graph-iframe"></iframe>
                    </div>
                </div>
            `;
        }

        function evidenceGoBack() {
            if (evidenceHistory.length > 0) {
                const prev = evidenceHistory.pop();
                if (prev && typeof prev === 'object' && prev.type === 'graph') {
                    openGraphDrawer(prev.query, true);
                } else if (typeof prev === 'string') {
                    openEvidenceInspector(prev, '', true);
                }
            }
        }

        function closeEvidenceInspector() {
            const drawer = document.getElementById('evidence-drawer');
            const backdrop = document.getElementById('evidence-drawer-backdrop');
            if (drawer) drawer.classList.remove('active');
            if (backdrop) backdrop.classList.remove('active');
            document.body.classList.remove('drawer-open');
            evidenceHistory = [];
            currentEvidenceSlug = null;
        }

        function handleMissingEvidenceLink(slug, text) {
            showToast(`«${slug}» — внутренняя перекрёстная ссылка. В выгрузке хакатона отдельный файл отсутствует.`, 'info');
        }

        function toggleDrawerWidth() {
            const drawer = document.getElementById('evidence-drawer');
            if (!drawer) return;
            isDrawerWide = !isDrawerWide;
            drawer.classList.toggle('wide', isDrawerWide);
        }

        function copyCitation(slug) {
            const text = `[${slug}]`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`Сноска ${text} скопирована в буфер`);
                }).catch(() => {
                    showToast(`Скопировано: ${text}`);
                });
            } else {
                showToast(`Сноска: ${text}`);
            }
        }

        function copyRawCode() {
            const hidden = document.getElementById('hidden-raw-code');
            if (!hidden) return;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(hidden.value).then(() => {
                    showToast('Код вложения скопирован');
                });
            } else {
                showToast('Код скопирован');
            }
        }

        function switchDocView(viewId, btn) {
            const parent = btn.closest('.evidence-content-inner');
            if (!parent) return;
            parent.querySelectorAll('.view-switch-btn').forEach(b => b.classList.remove('active'));
            parent.querySelectorAll('.doc-view-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            const target = parent.querySelector('#' + viewId);
            if (target) target.classList.add('active');

            // Автоматически расширяем шторку при включении графа для максимального пространства
            if (viewId === 'graph-view') {
                const drawer = document.getElementById('evidence-drawer');
                if (drawer && !isDrawerWide) {
                    toggleDrawerWidth();
                }
            }
        }

        function switchEvidenceTab(tabId, btn) {
            const parent = btn.closest('.evidence-content-inner');
            if (!parent) return;
            parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            parent.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            const target = parent.querySelector('#' + tabId);
            if (target) target.classList.add('active');
        }

        function searchWithinDocument(term) {
            const doc = document.getElementById('evidence-rendered-doc');
            const countEl = document.getElementById('doc-search-count');
            if (!doc) return;

            // Сбрасываем предыдущие маркеры
            const originalHtml = doc.getAttribute('data-original-html');
            if (!originalHtml) {
                doc.setAttribute('data-original-html', doc.innerHTML);
            } else {
                doc.innerHTML = originalHtml;
            }

            const cleanTerm = (term || '').trim();
            if (!cleanTerm || cleanTerm.length < 2) {
                if (countEl) countEl.innerText = '';
                return;
            }

            try {
                const regex = new RegExp(`(${cleanTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                let matches = 0;

                function highlightNodes(node) {
                    if (node.nodeType === 3) {
                        const text = node.nodeValue;
                        if (regex.test(text)) {
                            const span = document.createElement('span');
                            span.innerHTML = text.replace(regex, '<mark class="doc-match">$1</mark>');
                            const foundCount = (text.match(regex) || []).length;
                            matches += foundCount;
                            node.parentNode.replaceChild(span, node);
                        }
                    } else if (node.nodeType === 1 && node.childNodes && !['SCRIPT', 'STYLE', 'MARK', 'CODE'].includes(node.tagName)) {
                        Array.from(node.childNodes).forEach(highlightNodes);
                    }
                }

                highlightNodes(doc);

                if (countEl) {
                    countEl.innerText = matches > 0 ? `${matches} совп.` : '0 совп.';
                }

                const firstMatch = doc.querySelector('.doc-match');
                if (firstMatch) {
                    firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } catch (e) {
                console.warn('Highlight search error:', e);
            }
        }

        function clearDocSearch() {
            const input = document.getElementById('doc-search-input');
            if (input) {
                input.value = '';
                searchWithinDocument('');
            }
        }

        function filterTableRows(query) {
            const table = document.getElementById('evidence-csv-table');
            if (!table) return;
            const clean = (query || '').toLowerCase().trim();
            const rows = table.querySelectorAll('tbody tr');
            let visibleCount = 0;
            rows.forEach(r => {
                const text = r.innerText.toLowerCase();
                const match = !clean || text.includes(clean);
                r.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });
            const counter = document.querySelector('.table-rows-count');
            if (counter) {
                counter.innerText = clean ? `Найдено: ${visibleCount}` : `Строк: ${rows.length}`;
            }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `evidence-toast toast-${type}`;
            const iconSvg = type === 'info'
                ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`
                : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
            toast.innerHTML = `
                ${iconSvg}
                <span>${msg}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        // Закрытие по нажатию клавиши Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeEvidenceInspector();
            }
        });

        // Открытие графа связей в шторке на вкладке "Граф связей"
        // Открытие графа связей в шторке на вкладке "Граф связей"
        window.openGraphInDrawer = async function(slug) {
            if (!slug) return;
            // Сначала загружаем шторку с сервера
            await openEvidenceInspector(slug);
            // Теперь, когда HTML вставлен, переключаем на вкладку графа
            const switchBtns = document.querySelectorAll('.view-switch-btn');
            switchBtns.forEach(b => b.classList.remove('active'));
            const graphBtn = Array.from(switchBtns).find(b => 
                b.getAttribute('onclick') && b.getAttribute('onclick').includes('graph-view')
            );
            if (graphBtn) {
                graphBtn.classList.add('active');
                if (typeof switchDocView === 'function') switchDocView('graph-view', graphBtn);
            }
        };

        // Переключение меню трёх точек
        window.toggleMsgMenu = function(btn) {
            const dropdown = btn.nextElementSibling;
            const isOpen = dropdown.classList.contains('open');
            // Закрыть все открытые меню
            document.querySelectorAll('.msg-dropdown.open').forEach(d => d.classList.remove('open'));
            if (!isOpen) dropdown.classList.add('open');
        };

        // Закрытие меню при клике вне
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.msg-actions-wrap')) {
                document.querySelectorAll('.msg-dropdown.open').forEach(d => d.classList.remove('open'));
            }
        });

        // Скачивание контента сообщения
        // Скачивание контента сообщения через MCP сервер
        window.downloadBotMsg = async function(btn, format) {
            const msgContent = btn.closest('.message-content');
            const markdownBody = msgContent ? msgContent.querySelector('.markdown-body') : null;
            const text = markdownBody ? markdownBody.innerText : '';
            
            // Закрыть меню сразу
            btn.closest('.msg-dropdown').classList.remove('open');

            try {
                const response = await fetch('/api/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text, format: format })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Ответ_Квантум.${format}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                } else {
                    alert('Ошибка при скачивании файла через MCP');
                }
            } catch (err) {
                console.error(err);
                alert('Сбой сети при попытке скачать файл.');
            }
        };
    </script>

    <script>
        // --- Auth, Settings & Avatar Logic ---
        document.addEventListener('DOMContentLoaded', function() {
            const authOverlay = document.getElementById('auth-overlay');
            const authForm = document.getElementById('auth-form');
            const authProfileDisplay = document.getElementById('auth-profile-display');
            const authProfileName = document.getElementById('auth-profile-name');
            const authProfileAvatar = document.getElementById('auth-profile-avatar-node');

            const settingsOverlay = document.getElementById('settings-overlay');
            const settingsForm = document.getElementById('settings-form');
            const openSettingsBtn = document.getElementById('open-settings-btn');
            const logoutBtn = document.getElementById('logout-btn');

            function getInitials(name) {
                if (!name) return 'Вы';
                const parts = name.split(' ').filter(p => p.trim() !== '');
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[1][0]).toUpperCase();
                } else if (parts.length === 1) {
                    return (parts[0][0] + (parts[0].length > 1 ? parts[0][1] : '')).toUpperCase();
                }
                return 'Вы';
            }

            function updateUserUI() {
                const fName = localStorage.getItem('auth_firstName') || '';
                const lName = localStorage.getItem('auth_lastName') || '';
                const loginStr = localStorage.getItem('auth_login') || '';
                const avatarUrl = localStorage.getItem('auth_avatar') || '';

                let displayName = '';
                if (fName || lName) {
                    displayName = `${fName} ${lName}`.trim();
                } else {
                    displayName = loginStr || 'Пользователь';
                }

                if (authProfileName) authProfileName.textContent = displayName;
                
                const initials = getInitials(displayName);

                // Update sidebar avatar
                if (authProfileAvatar) {
                    if (avatarUrl) {
                        authProfileAvatar.style.background = 'transparent';
                        authProfileAvatar.innerHTML = `<img src="${avatarUrl}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                    } else {
                        authProfileAvatar.style.background = 'var(--accent)';
                        authProfileAvatar.innerHTML = initials;
                    }
                }

                // Update all user message avatars
                document.querySelectorAll('.user-avatar').forEach(el => {
                    if (avatarUrl) {
                        el.style.background = 'transparent';
                        el.innerHTML = `<img src="${avatarUrl}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                    } else {
                        el.style.background = 'var(--pastel-green)';
                        el.innerHTML = initials;
                    }
                });
            }

            const savedUser = localStorage.getItem('auth_login');
            if (savedUser) {
                authOverlay.style.display = 'none';
                if (authProfileDisplay) authProfileDisplay.style.display = 'flex';
                updateUserUI();
            } else {
                authOverlay.style.display = 'flex';
            }

            if (authForm) {
                authForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const loginStr = document.getElementById('auth-login').value;
                    localStorage.setItem('auth_login', loginStr);
                    localStorage.removeItem('auth_firstName');
                    localStorage.removeItem('auth_lastName');
                    localStorage.removeItem('auth_avatar');
                    
                    updateUserUI();
                    authOverlay.style.opacity = '0';
                    setTimeout(() => {
                        authOverlay.style.display = 'none';
                        if (authProfileDisplay) authProfileDisplay.style.display = 'flex';
                    }, 300);
                });
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    localStorage.clear();
                    location.reload();
                });
            }

            if (openSettingsBtn) {
                openSettingsBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.getElementById('settings-firstname').value = localStorage.getItem('auth_firstName') || '';
                    document.getElementById('settings-lastname').value = localStorage.getItem('auth_lastName') || '';
                    const avatarUrl = localStorage.getItem('auth_avatar') || '';
                    const radios = document.querySelectorAll('input[name="avatar"]');
                    radios.forEach(r => r.checked = false);
                    const match = Array.from(radios).find(r => r.value === avatarUrl);
                    if (match) match.checked = true;
                    settingsOverlay.style.display = 'flex';
                });
            }

            if (settingsForm) {
                settingsForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    localStorage.setItem('auth_firstName', document.getElementById('settings-firstname').value.trim());
                    localStorage.setItem('auth_lastName', document.getElementById('settings-lastname').value.trim());
                    const avatarUrl = document.querySelector('input[name="avatar"]:checked').value;
                    if (avatarUrl) {
                        localStorage.setItem('auth_avatar', avatarUrl);
                    } else {
                        localStorage.removeItem('auth_avatar');
                    }
                    updateUserUI();
                    settingsOverlay.style.display = 'none';
                });
            }

            // Наблюдатель за новыми сообщениями, чтобы обновлять аватарки
            // Наблюдатель за новыми сообщениями, чтобы обновлять аватарки
            const observer = new MutationObserver(function(mutations) {
                let shouldUpdate = false;
                mutations.forEach(m => { 
                    // Проверяем, что добавились именно сообщения, а не внутренности аватарки
                    Array.from(m.addedNodes).forEach(node => {
                        if (node.nodeType === 1 && (node.classList.contains('message') || node.querySelector('.user-avatar'))) {
                            shouldUpdate = true;
                        }
                    });
                });
                
                if (shouldUpdate) {
                    observer.disconnect(); // отключаем на время обновления
                    updateUserUI();
                    if (chatArea) observer.observe(chatArea, { childList: true, subtree: true });
                }
            });
            const chatArea = document.querySelector('.chat-scroll-area');
            if (chatArea) {
                observer.observe(chatArea, { childList: true, subtree: true });
            }
        });
    </script>
