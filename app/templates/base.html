<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-помощник | Сбер</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Фоновые анимированные пятна (Нежные цвета) -->
    <div class="bg-blobs">
        <div class="blob blob-green"></div>
        <div class="blob blob-orange"></div>
        <div class="blob blob-purple"></div>
    </div>

    <!-- Общая обертка (sidebar + основной контент) -->
    <div class="app-layout">
        
        <!-- Левая панель -->
        <aside class="sidebar">
            <div class="sidebar-logo">Квантум</div>
            
            <button class="new-chat-btn" onclick="location.reload()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Новый чат
            </button>
            
            <div class="sidebar-nav">
                <h3>История</h3>
                <a href="#" class="history-item active">Лимиты продукта Мостик</a>
                <a href="#" class="history-item">Регламент по кредитам</a>
                <a href="#" class="history-item">OCR таблиц (Искра)</a>
            </div>
            
            <div class="sidebar-footer">
                <a href="#" class="settings-btn" id="theme-toggle">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <span id="theme-text">Темная тема</span>
                </a>
                <a href="#" class="settings-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    Настройки
                </a>
            </div>
        </aside>

        <!-- Основная область с чатом -->
        <main class="main-view">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Инициализация темы
        const themeText = document.getElementById('theme-text');
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            if(themeText) themeText.innerText = 'Светлая тема';
        }

        // Переключение темы
        document.getElementById('theme-toggle').addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeText.innerText = isDark ? 'Светлая тема' : 'Темная тема';
        });

        // Быстрая вставка текста в инпут и программная отправка формы
        function sendQuickPrompt(text) {
            const input = document.querySelector('.input-field');
            const form = document.querySelector('.input-form');
            input.value = text;
            
            // Триггерим событие submit для HTMX
            const event = new Event('submit', { cancelable: true, bubbles: true });
            form.dispatchEvent(event);
        }
        
        // Скрываем welcome-экран при добавлении первого сообщения и скроллим вниз
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if(evt.detail.target.id === 'chat-history') {
                const welcome = document.querySelector('.welcome-screen');
                if(welcome) welcome.style.display = 'none';
                
                // Прокрутка чата вниз (скроллится область .chat-scroll-area)
                const scrollArea = document.getElementById('chat-scroll-area');
                if(scrollArea) {
                    scrollArea.scrollTop = scrollArea.scrollHeight;
                }
            }
        });
    </script>
</body>
</html>
